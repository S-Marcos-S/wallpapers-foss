name: Sync Telegram Wallpapers

on:
  schedule:
    # Runs twice a day: at 05:00 UTC (02:00 BRT) and at 14:00 UTC (30 min before analysis at 14:30 UTC)
    - cron: '0 5,14 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
    inputs:
      fallback_count:
        description: 'Number of older wallpapers to rescue if no new ones are found'
        required: false
        default: '15'
        type: string
      enable_fallback:
        description: 'Enable older wallpaper retrieval if no new ones are found'
        required: false
        default: true
        type: boolean
      max_classify:
        description: 'Maximum wallpapers to classify and curate with Gemini'
        required: false
        default: '30'
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Sync from Amanda Wallpaper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pillow opencv-python-headless

      - name: Run Telegram sync script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          FALLBACK_BACKFILL_COUNT: ${{ inputs.fallback_count || '15' }}
          ENABLE_FALLBACK_BACKFILL: ${{ inputs.enable_fallback != false }}
          WALLPAPERS_CDN_URL: ${{ secrets.WALLPAPERS_CDN_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/sync_telegram.py

      - name: Classify wallpapers with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_CLASSIFY_PER_RUN: ${{ inputs.max_classify || '30' }}
        run: |
          python scripts/classify_with_gemini.py

      - name: Update statistics in README
        run: |
          python scripts/wallpaper_stats.py

      - name: Commit and push new wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove any full-res media files to keep Git repo lightweight (served via CDN/Telegram)
          rm -rf wallpapers/full/* wallpapers/staging/* 2>/dev/null || true

          if [ -n "$(git status --porcelain README.md wallpapers/thumbnails/ wallpapers/catalog.json wallpapers/notification.json)" ]; then
            git add README.md wallpapers/thumbnails/ wallpapers/catalog.json wallpapers/notification.json
            git commit -m "chore(wallpapers): auto-sync curated wallpapers and update README stats [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated wallpapers catalog."
          else
            echo "No new wallpapers to commit."
          fi
